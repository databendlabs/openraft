name: ci

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_call:

# A called workflow inherits the caller's github.workflow and event context.
# Use a literal prefix to avoid colliding with the full workflow's group,
# and the event to keep its nested checks separate from main-push checks.
concurrency:
  group: ci-fast-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # GitHub records this local reusable workflow's immutable SHA in the run's
  # referenced_workflows metadata, including the synthetic PR merge SHA.
  plan:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-reuse.yaml

  # Keep the jobs (including matrix variants) alive even when reusing CI, so
  # every existing required check reports on the merge-group SHA. The first
  # step fails closed if the planner failed or returned an invalid decision.
  # Test crate `openraft/` and `macros/`
  test-openraft-core-crates:
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: 'stable'
            features: ''

          - toolchain: 'nightly'
            features: ''

    steps:
      - &reuse-decision
        name: Verify CI reuse decision
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          REUSE: ${{ needs.plan.outputs.reuse }}
          SOURCE: ${{ needs.plan.outputs.source }}
        shell: bash
        run: |
          test "$PLAN_RESULT" = success
          case "$REUSE" in
            true) echo "Reusing successful PR CI: $SOURCE" ;;
            false) ;;
            *) echo "Invalid CI reuse decision" >&2; exit 1 ;;
          esac

      - &checkout
        name: Setup | Checkout
        if: needs.plan.outputs.reuse != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - &pin-nightly
        name: Pin nightly from rust-toolchain
        if: needs.plan.outputs.reuse != 'true' && matrix.toolchain == 'nightly'
        run: echo "PIN=$(cat rust-toolchain)" >> "$GITHUB_ENV"

      - &matrix-toolchain
        name: Setup | Toolchain
        if: needs.plan.outputs.reuse != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain == 'nightly' && env.PIN || matrix.toolchain }}

      - name: Install cargo-expand
        if: needs.plan.outputs.reuse != 'true'
        run: cargo install cargo-expand

      - name: Test crate `macros/`
        if: needs.plan.outputs.reuse != 'true'
        run: cargo test --features "${{ matrix.features }}" --manifest-path macros/Cargo.toml
        env:
          RUST_LOG: debug
          RUST_BACKTRACE: full

      - name: Test crate `membership/`
        if: needs.plan.outputs.reuse != 'true'
        run: make test-membership
        env:
          RUST_LOG: debug
          RUST_BACKTRACE: full

      - name: Test crate `openraft/`
        if: needs.plan.outputs.reuse != 'true'
        run: cargo test --features "${{ matrix.features }}" --manifest-path openraft/Cargo.toml
        env:
          RUST_LOG: debug
          RUST_BACKTRACE: full

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 'ut-openraft-${{ matrix.toolchain }}-${{ matrix.features }}'
          path: |
            openraft/_log/

  # Run integration test `tests/`.
  test-crate-tests:
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: 'stable'
            send_delay: '0'
            features: ''

          # With network delay
          - toolchain: 'nightly'
            send_delay: '30'
            features: ''

          # Feature-flag: Standard raft term
          - toolchain: 'nightly'
            send_delay: '0'
            features: 'single-term-leader'

    steps:
      - *reuse-decision
      - *checkout
      - *pin-nightly
      - *matrix-toolchain

      - name: Test crate `tests/`
        if: needs.plan.outputs.reuse != 'true'
        run: cargo test --features "${{ matrix.features }}" --manifest-path tests/Cargo.toml
        env:
          # Parallel tests block each other and result in timeout.
          RUST_TEST_THREADS: 2
          RUST_LOG: debug
          RUST_BACKTRACE: full
          OPENRAFT_NETWORK_SEND_DELAY: ${{ matrix.send_delay }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 'ut-tests-${{ matrix.toolchain }}-${{ matrix.features }}-${{ matrix.send_delay }}'
          path: |
            tests/_log/

  stores:
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - store: 'stores/memstore'
          - store: 'stores/memstore-custom-node-id'

    steps:
      - *reuse-decision
      - *checkout
      - &default-toolchain
        name: Setup | Toolchain
        if: needs.plan.outputs.reuse != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # - A store with defensive checks returns error when unexpected accesses are sent to RaftStore.
      # - Raft should not depend on defensive error to work correctly.
      - name: Unit Tests, with defensive store
        if: needs.plan.outputs.reuse != 'true'
        run: cargo test --manifest-path "${{ matrix.store }}/Cargo.toml"
        env:
          # Parallel tests block each other and result in timeout.
          RUST_TEST_THREADS: 2
          RUST_LOG: debug
          RUST_BACKTRACE: full
          OPENRAFT_STORE_DEFENSIVE: on

  rt-tokio:
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - *reuse-decision
      - *checkout
      - *default-toolchain

      - name: Unit Tests
        if: needs.plan.outputs.reuse != 'true'
        run: |
          cargo test --manifest-path "rt-tokio/Cargo.toml"
          cargo test --manifest-path "rt-tokio/Cargo.toml" --features single-threaded
        env:
          RUST_LOG: debug
          RUST_BACKTRACE: full

  # Feature "serde" will be enabled if one of the member crates enables
  # "serde", such as `memstore`, when building a cargo workspace.
  #
  # To test openraft with "serde" off, it must not build other crates.
  #
  # This job only tests crate `openraft`.
  openraft-feature-test:
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          # Default feature set (includes "tokio-rt" and "clap")
          - toolchain: 'nightly'
            extra_args: ''
            features: ''

          # Without "clap": drops clap and byte-unit deps; tokio-rt added
          # back so the runtime is still wired up
          - toolchain: 'nightly'
            extra_args: '--no-default-features'
            features: 'tokio-rt'

          # Enable "serde"
          - toolchain: 'nightly'
            extra_args: ''
            features: 'serde'

          - toolchain: 'nightly'
            extra_args: ''
            features: 'serde,single-threaded'

          - toolchain: 'nightly'
            extra_args: ''
            features: 'metrics-logids'

          - toolchain: 'nightly'
            extra_args: ''
            features: 'metrics-logids,serde'

    steps:
      - *reuse-decision
      - *checkout
      - *pin-nightly
      - *matrix-toolchain

      - name: Check isolated feature builds
        if: needs.plan.outputs.reuse != 'true' && matrix.features == '' && matrix.extra_args == ''
        run: make feature-check

      - name: Test crate `openraft/`
        if: needs.plan.outputs.reuse != 'true'
        run: cargo test ${{ matrix.extra_args }} --features "${{ matrix.features }}" --manifest-path openraft/Cargo.toml
        env:
          # Parallel tests block each other and result in timeout.
          RUST_TEST_THREADS: 2
          RUST_LOG: debug
          RUST_BACKTRACE: full

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: openraft-feature-test
          path: |
            openraft/_log/

  # Integration tests with various features.
  tests-feature-test:
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: 'nightly'
            features: ''

          - toolchain: 'nightly'
            features: 'single-term-leader'

    steps:
      - *reuse-decision
      - *checkout
      - *pin-nightly
      - *matrix-toolchain

      - name: Test crate `tests/`
        if: needs.plan.outputs.reuse != 'true'
        run: cargo test --features "${{ matrix.features }}" --manifest-path tests/Cargo.toml
        env:
          # Parallel tests block each other and result in timeout.
          RUST_TEST_THREADS: 2
          RUST_LOG: debug
          RUST_BACKTRACE: full

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tests-feature-test
          path: |
            tests/_log/

  # Test the simulated runtime: an external crate, like rt-monoio and rt-compio.
  rt-sim:
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - *reuse-decision
      - *checkout
      - &clippy-toolchain
        name: Setup | Toolchain
        if: needs.plan.outputs.reuse != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Clippy
        if: needs.plan.outputs.reuse != 'true'
        run: cargo clippy --no-deps --manifest-path "rt-sim/Cargo.toml" --all-targets --features sim-log -- -D warnings

      - name: Unit Tests
        if: needs.plan.outputs.reuse != 'true'
        run: cargo test --tests --manifest-path "rt-sim/Cargo.toml" --features sim-log
        env:
          RUST_BACKTRACE: full

  # Run crate `tests/` on rt-sim. Then run the `t24_append_membership` tests in
  # each of two processes with the same seed, and require byte-identical full
  # OpenRaft logs. One of them must also write the same lines alone as after
  # another test in the same process.
  tests-rt-sim:
    needs: plan
    if: ${{ !cancelled() }}
    name: Tests on simulated runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - *reuse-decision
      - *checkout
      - *clippy-toolchain

      - name: Clippy
        if: needs.plan.outputs.reuse != 'true'
        run: cargo clippy --no-deps --manifest-path tests/Cargo.toml --all-targets --features rt-sim -- -D warnings

      - name: Test
        if: needs.plan.outputs.reuse != 'true'
        run: cargo test --manifest-path tests/Cargo.toml --features rt-sim
        env:
          RUST_BACKTRACE: full

      - name: Same seed, same log
        if: needs.plan.outputs.reuse != 'true'
        run: |
          for run in a b; do
            OPENRAFT_SIM_LOG="$RUNNER_TEMP/$run.log" cargo test --manifest-path tests/Cargo.toml --features rt-sim \
              --test membership -- --test-threads=1 t24_append_membership::
          done
          test -s "$RUNNER_TEMP/a.log"
          diff "$RUNNER_TEMP/a.log" "$RUNNER_TEMP/b.log"

          # `follower_answers_forward_to_leader` ran after another t24 test above.
          # Alone, it must write the same lines. Each line names its test span.
          OPENRAFT_SIM_LOG="$RUNNER_TEMP/alone.log" cargo test --manifest-path tests/Cargo.toml --features rt-sim \
            --test membership -- --exact t24_append_membership::follower_answers_forward_to_leader
          span=membership::t24_append_membership@follower_answers_forward_to_leader
          grep -F "$span" "$RUNNER_TEMP/a.log" > "$RUNNER_TEMP/after-others.log"
          grep -F "$span" "$RUNNER_TEMP/alone.log" > "$RUNNER_TEMP/alone-only.log"
          test -s "$RUNNER_TEMP/alone-only.log"
          diff "$RUNNER_TEMP/after-others.log" "$RUNNER_TEMP/alone-only.log"
        env:
          OPENRAFT_RT_SIM_SEED: 9
          OPENRAFT_NETWORK_SEND_DELAY: 30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tests-rt-sim
          path: |
            tests/_log/

  # Deterministic simulation test with turmoil.
  detsim:
    needs: plan
    if: ${{ !cancelled() }}
    name: Deterministic simulation test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *reuse-decision
      - *checkout

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: needs.plan.outputs.reuse != 'true'
        with:
          # tests-turmoil is excluded from the root workspace, so the default
          # cache misses its target dir and the fuzz binary recompiles cold
          # every run. Cache this workspace so warm runs skip the compile.
          cache-workspaces: tests-turmoil
          # The action exports RUSTFLAGS="-D warnings" by default, and any
          # RUSTFLAGS env var overrides the `--cfg tokio_unstable` rustflags
          # from tests-turmoil/.cargo/config.toml. Keep RUSTFLAGS unset so
          # the config applies.
          rustflags: ""

      - name: Run Turmoil unit and regression tests
        if: needs.plan.outputs.reuse != 'true'
        shell: bash
        run: make test-turmoil-default 2>&1 | tee "$RUNNER_TEMP/turmoil-tests.log"

      - name: Replay log ID reuse regression (seed 812)
        if: needs.plan.result == 'success' && needs.plan.outputs.reuse == 'false' && (success() || failure())
        shell: bash
        run: |
          cd tests-turmoil
          cargo run --release --bin fuzz -- --reproduce 812 --max-steps 10000 --storage lossy \
            --crash-file "$RUNNER_TEMP/turmoil-seed812.json" 2>&1 | tee "$RUNNER_TEMP/turmoil-seed812.log"
        env:
          RUST_LOG: info
          RUST_BACKTRACE: full

      - name: Run deterministic simulation
        if: needs.plan.result == 'success' && needs.plan.outputs.reuse == 'false' && (success() || failure())
        shell: bash
        run: |
          cd tests-turmoil
          cargo run --release --bin fuzz -- --iterations 5 --max-steps 10000 --storage lossy \
            --crash-file "$RUNNER_TEMP/turmoil-random.json" 2>&1 | tee "$RUNNER_TEMP/turmoil-random.log"
        env:
          RUST_LOG: info
          RUST_BACKTRACE: full

      - name: Upload simulation failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: turmoil-default
          path: ${{ runner.temp }}/turmoil-*

  # The same simulation with `ThresholdMembership` and random read and write sizes.
  detsim-threshold:
    needs: plan
    if: ${{ !cancelled() }}
    name: Deterministic simulation test with ThresholdMembership
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *reuse-decision
      - *checkout

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: needs.plan.outputs.reuse != 'true'
        with:
          # See the `detsim` job for both settings.
          cache-workspaces: tests-turmoil
          rustflags: ""

      - name: Run Turmoil unit and regression tests with ThresholdMembership
        if: needs.plan.outputs.reuse != 'true'
        shell: bash
        run: make test-turmoil-threshold 2>&1 | tee "$RUNNER_TEMP/turmoil-tests.log"

      - name: Run deterministic simulation with ThresholdMembership
        if: needs.plan.result == 'success' && needs.plan.outputs.reuse == 'false' && (success() || failure())
        shell: bash
        run: |
          cd tests-turmoil
          cargo run --release --bin fuzz --features threshold-membership -- --iterations 5 --max-steps 10000 --storage lossy \
            --crash-file "$RUNNER_TEMP/turmoil-random.json" 2>&1 | tee "$RUNNER_TEMP/turmoil-random.log"
        env:
          RUST_LOG: info
          RUST_BACKTRACE: full

      - name: Upload simulation failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: turmoil-threshold
          path: ${{ runner.temp }}/turmoil-*

  lint:
    needs: plan
    if: ${{ !cancelled() }}
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *reuse-decision
      - *checkout

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: needs.plan.outputs.reuse != 'true'
        with:
          components: rustfmt, clippy

      - name: CI policy tests
        if: needs.plan.outputs.reuse != 'true'
        run: make ci-check

      - name: Format
        if: needs.plan.outputs.reuse != 'true'
        run: cargo fmt --all -- --check

      - name: Format tests-turmoil
        if: needs.plan.outputs.reuse != 'true'
        run: cargo fmt --manifest-path tests-turmoil/Cargo.toml -- --check

      - name: clippy
        if: needs.plan.outputs.reuse != 'true'
        shell: bash
        run: |
          cargo clippy --no-deps --workspace --all-targets                -- -D warnings
          cargo clippy --no-deps --workspace --all-targets --features "bt,serde,bench,compat" -- -D warnings
          cargo clippy --no-deps --workspace --all-targets --features "metrics-logids,serde" -- -D warnings

      - name: clippy tests-turmoil
        if: needs.plan.outputs.reuse != 'true'
        # Run from inside tests-turmoil so its .cargo/config.toml is read, and
        # override the job-wide RUSTFLAGS="-D warnings" (set by the toolchain
        # action), which would otherwise replace the config's rustflags and
        # drop `--cfg tokio_unstable`. Warnings still fail via clippy's own
        # `-D warnings` argument.
        run: |
          cd tests-turmoil
          cargo clippy --no-deps --all-targets -- -D warnings
          cargo clippy --no-deps --all-targets --features threshold-membership -- -D warnings
        env:
          RUSTFLAGS: --cfg tokio_unstable

      # Documentation build, doctests, and the repository-link check. Run
      # through the Make target so contributors gate on the same command.
      - name: Docs
        if: needs.plan.outputs.reuse != 'true'
        run: make docs-check

      # The four SVGs in assets/logo are written by the two scripts beside
      # them. Regenerate and fail on a diff, so an edited script that was never
      # re-run, or a hand-edited SVG, cannot reach main. Both scripts write next
      # to __file__, so the checkout root is the right working directory.
      - name: Logo assets
        if: needs.plan.outputs.reuse != 'true'
        run: |
          python3 assets/logo/generate_mark.py
          python3 assets/logo/generate_banner.py
          git diff --exit-code assets/logo

      - name: Install cargo-audit
        if: needs.plan.outputs.reuse != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        if: needs.plan.outputs.reuse != 'true'
        shell: bash
        # if: "!contains(github.event.head_commit.message, 'skip audit')"
        run: cargo audit --db ./target/advisory-db
