name: jepsen

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  jepsen:
    name: Jepsen (${{ matrix.nemesis }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        nemesis:
          - membership
          - partition
          - pause
          - process

    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Test | Jepsen
        run: make -C jepsen jepsen NEMESIS=${{ matrix.nemesis }}

      - name: Debug | Docker logs
        if: failure()
        run: |
          docker compose -f jepsen/docker/docker-compose.yml logs --no-color \
            | tee jepsen/docker-compose.log

      - name: Debug | Upload Jepsen results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jepsen-results-${{ matrix.nemesis }}
          path: |
            jepsen/store/
            jepsen/docker-compose.log
          if-no-files-found: ignore

      - name: Cleanup | Docker
        if: always()
        run: make -C jepsen down
