name: jepsen

on:
  pull_request:
    paths:
      - 'jepsen/**'
      - '.github/workflows/jepsen.yml'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'rust-toolchain'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UBUNTU_APT_MIRROR: http://azure.archive.ubuntu.com/ubuntu/

jobs:
  check:
    name: Jepsen lint and unit tests
    if: github.event_name == 'pull_request'
    # Match ci-full.yaml: the app needs the RocksDB 8.x C API from Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ROCKSDB_LIB_DIR: /usr/lib/x86_64-linux-gnu
      ROCKSDB_INCLUDE_DIR: /usr/include

    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Setup | Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: jepsen/project.clj

      - name: Setup | Clojure tools
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          lein: 2.12.0
          clj-kondo: 2026.07.24
          cljfmt: 0.16.5

      - name: Setup | Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Check | Clojure
        run: make -C jepsen clojure-lint

      - name: Setup | System RocksDB
        # Use the node image's apt sources: the CI mirror first, then Ubuntu's
        # archive. jepsen/docker/node.Dockerfile explains the undelayed retries.
        run: |
          printf '%s\tpriority:1\nhttp://archive.ubuntu.com/ubuntu/\tpriority:2\n' "$UBUNTU_APT_MIRROR" \
            | sudo tee /etc/apt/jepsen-mirrors.list > /dev/null
          sudo sed -i "s|^URIs: .*|URIs: mirror+file:/etc/apt/jepsen-mirrors.list|" /etc/apt/sources.list.d/ubuntu.sources
          apt_opts=(-o Acquire::http::Timeout=15 -o Acquire::Retries=3 -o Acquire::Retries::Delay=false)
          sudo apt-get "${apt_opts[@]}" update --error-on=any
          sudo apt-get "${apt_opts[@]}" install -y librocksdb-dev

      - name: Check | Test app
        run: make -C jepsen app-lint

      - name: Test | Test app
        run: make -C jepsen app-test

      - name: Test | Clojure
        run: make -C jepsen unit-test

  node-image:
    name: Jepsen node image build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check | Node image build inputs
        id: inputs
        run: |
          # The PR merge commit's first parent is the base that CI builds against.
          changed=$(git diff --name-only HEAD^1 HEAD -- \
            .github/workflows/jepsen.yml .cargo/ Cargo.toml rust-toolchain \
            jepsen/Makefile jepsen/docker/ jepsen/openraft-test-app/Cargo.toml \
            jepsen/openraft-test-app/Cargo.lock)
          if [[ -n "$changed" ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build | Jepsen node image
        if: steps.inputs.outputs.build == 'true'
        run: make -C jepsen build-node

  jepsen:
    name: Jepsen (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: membership
            target: safety
            nemesis: membership
          - name: partition
            target: safety
            nemesis: partition
          - name: pause
            target: safety
            nemesis: pause
            time_limit: 180
          - name: process
            target: safety
            nemesis: process
          - name: packet-slow
            target: safety
            nemesis: packet
            packet_mode: slow
          - name: packet-flaky
            target: safety
            nemesis: packet
            packet_mode: flaky
          - name: clock
            target: safety
            nemesis: clock
          - name: chaos
            target: safety
            nemesis: chaos
          - name: liveness
            target: liveness

    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Build | Jepsen images
        run: make -C jepsen build

      - name: Test | Jepsen
        run: |
          make -C jepsen up
          docker compose -f jepsen/docker/docker-compose.yml exec control lein test
          make -C jepsen ${{ matrix.target }} NEMESIS=${{ matrix.nemesis }} PACKET_MODE=${{ matrix.packet_mode }} TIME_LIMIT=${{ matrix.time_limit }}

      - name: Debug | Docker logs
        if: failure()
        run: |
          docker compose -f jepsen/docker/docker-compose.yml logs --no-color \
            | tee jepsen/docker-compose.log

      - name: Results | Upload Jepsen results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jepsen-results-${{ matrix.name }}
          path: jepsen/store/**/results.edn
          if-no-files-found: ignore

      - name: Debug | Upload Jepsen diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jepsen-debug-${{ matrix.name }}
          path: |
            jepsen/store/
            jepsen/docker-compose.log
          if-no-files-found: ignore

      - name: Cleanup | Docker
        if: always()
        run: make -C jepsen down
