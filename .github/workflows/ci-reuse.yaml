name: ci-reuse

on:
  workflow_call:
    outputs:
      reuse:
        description: Whether successful PR CI tested the queue's exact tree
        value: ${{ jobs.plan.outputs.reuse }}
      source:
        description: URL of the successful PR CI run being reused
        value: ${{ jobs.plan.outputs.source }}

jobs:
  plan:
    name: CI reuse decision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
      source: ${{ steps.reuse.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record the tree actually checked out
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Look for successful PR CI on the same tree
        id: reuse
        uses: actions/github-script@v7
        env:
          TESTED_TREE: ${{ steps.tree.outputs.tree }}
        with:
          script: |
            const reuseCi = require(`${process.env.GITHUB_WORKSPACE}/scripts/ci-reuse.cjs`);
            const reuse = await reuseCi({ github, context, core, tree: process.env.TESTED_TREE });
            core.setOutput('reuse', String(reuse));
