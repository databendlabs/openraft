[package]
name = "openraft-multi"
description = "Multi-Raft adapters for connection sharing across Raft groups"
documentation = "https://docs.rs/openraft-multiraft"
readme = "README.md"
version = "0.10.1"
edition = "2024"
authors = ["Databend Authors <opensource@datafuselabs.com>"]
categories = ["network-programming", "asynchronous", "data-structures"]
homepage = "https://github.com/databendlabs/openraft"
keywords = ["consensus", "raft", "multi-raft"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/databendlabs/openraft"

[dependencies]
openraft     = { path = "../openraft", version = "0.10.1", default-features = false }
anyerror     = { version = "0.1" }
futures-util = { version = "0.3" }
serde        = { version = "1.0.114", features = ["derive"], optional = true }
tracing      = { version = "0.1.40" }

[dev-dependencies]
openraft     = { path = "../openraft", version = "0.10.1", default-features = false, features = ["tokio-rt"] }

[features]
# Derive serde for the batch types, so that an application can put them on the wire.
serde = ["dep:serde", "openraft/serde"]
