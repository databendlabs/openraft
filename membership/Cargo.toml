[package]
name = "openraft-membership"
description = "Provided membership implementations for OpenRaft"
documentation = "https://docs.rs/openraft-membership"

version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
categories = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
openraft = { path = "../openraft", version = "0.10.0-alpha.37", default-features = false }
openraft-macros = { path = "../macros", version = "0.10.0-alpha.37" }
display-more = { workspace = true }
quorum-set = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
anyerror = { workspace = true }
bincode = { workspace = true }
maplit = { workspace = true }
openraft-rt-tokio = { path = "../rt-tokio", version = "0.10.0-alpha.37" }
serde_json = { workspace = true }

[features]
default = ["serde"]
serde = ["openraft/serde"]
single-threaded = ["openraft/single-threaded", "openraft-rt-tokio/single-threaded"]
