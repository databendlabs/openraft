[package]
name = "membership"
version = "0.1.0"
readme = "README.md"

edition = "2024"
authors = [
    "drdr xp <drdr.xp@gmail.com>",
]
categories = ["algorithms", "asynchronous", "data-structures"]
description = "Run each membership that `openraft` and `openraft-membership` provide in an in-process cluster."
homepage = "https://github.com/databendlabs/openraft"
keywords = ["raft", "consensus", "membership"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/databendlabs/openraft"

[dependencies]
log-mem        = { path = "../log-mem" }
network-v2-mem = { path = "../network-v2-mem" }
openraft       = { path = "../../openraft", features = ["serde", "type-alias"] }
sm-mem         = { path = "../sm-mem" }
types-kv       = { path = "../types-kv" }

# The default `serde` feature is required: `openraft/serde` is on in this build.
openraft-membership = { path = "../../membership" }

anyhow             = { version = "1.0.63" }
clap               = { version = "4.1.11", features = ["derive"] }
tokio              = { version = "1.35.1", features = ["full"] }
tracing            = { version = "0.1.29" }
tracing-subscriber = { version = "0.3.0", features = ["env-filter"] }

[features]

[package.metadata.docs.rs]
all-features = true
