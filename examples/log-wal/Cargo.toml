[package]
name = "log-wal"
version = "0.1.0"
readme = "README.md"

edition = "2024"
authors = [
    "drdr xp <drdr.xp@gmail.com>",
]
categories = ["algorithms", "asynchronous", "data-structures"]
description = "An example write-ahead-log backed log storage for `openraft`."
homepage = "https://github.com/databendlabs/openraft"
keywords = ["raft", "consensus"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/databendlabs/openraft"

[dependencies]
openraft = { path = "../../openraft", version = "0.10.0-alpha.34", features = ["serde", "type-alias"] }

raft-log   = { version = "0.4.5" }
rmp-serde  = { version = "1.3.0" }
serde      = { version = "1.0.114" }
tokio      = { version = "1.35.0", features = ["sync"] }
tracing    = { version = "0.1.40" }

[dev-dependencies]
openraft-memstore = { path = "../../stores/memstore", version = "0.10.0-alpha.34" }
tempfile          = { version = "3.4.0" }

[features]
bt = ["openraft/bt"]

[package.metadata.docs.rs]
all-features = true
