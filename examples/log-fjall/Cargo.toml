[package]
name = "log-fjall"
version = "0.1.0"
readme = "README.md"

edition = "2024"
authors = [
    "ariesdevil <ariesdevil77@gmail.com>",
]
categories = ["algorithms", "asynchronous", "data-structures"]
description = "An example fjall-backed log storage for `openraft`."
homepage = "https://github.com/databendlabs/openraft"
keywords = ["raft", "consensus"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/databendlabs/openraft"

[dependencies]
openraft = { path = "../../openraft", version = "0.10.0-alpha.38", features = ["serde", "type-alias"] }

fjall      = { version = "3.1.13" }
serde      = { version = "1.0.114" }
serde_json = { version = "1.0.57" }
tracing    = { version = "0.1.40" }

[dev-dependencies]
openraft-memstore = { path = "../../stores/memstore", version = "0.10.0-alpha.38" }
tempfile          = { version = "3.4.0" }

[features]
bt = ["openraft/bt"]

[package.metadata.docs.rs]
all-features = true
