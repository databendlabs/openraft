[package]
name = "raft-kv-rocksdb"
version = "0.1.0"
readme = "README.md"

edition = "2024"
authors = [
  "drdr xp <drdr.xp@gmail.com>",
  "Pedro Paulo de Amorim <pepa.amorim@gmail.com>",
  "The Tremor Team",
]
categories = ["algorithms", "asynchronous", "data-structures"]
description = "An example distributed key-value store built upon `openraft`."
homepage = "https://github.com/databendlabs/openraft"
keywords = ["raft", "consensus"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/databendlabs/openraft"

[[bin]]
name = "raft-key-value-rocks"
path = "src/bin/main.rs"

[dependencies]
app-http            = { path = "../app-http" }
dir-transfer        = { path = "../dir-transfer" }
log-rocks           = { path = "../log-rocks" }
network-v2-http     = { path = "../network-v2-http" }
openraft            = { path = "../../openraft", features = ["serde", "type-alias"] }
sm-rocks            = { path = "../sm-rocks" }
types-kv            = { path = "../types-kv" }

bytes              = { version = "1.0" }
clap               = { version = "4.1.11", features = ["derive", "env"] }
futures            = { version = "0.3" }
http-body-util     = { version = "0.1" }
hyper              = { version = "1.0", features = ["http1", "server"] }
hyper-util         = { version = "0.1", features = ["tokio"] }
reqwest            = { version = "0.12.5", features = ["json", "stream"] }
rmp-serde          = { version = "1.3.0" }
serde              = { version = "1.0.114", features = ["derive"] }
serde_json         = { version = "1.0.57" }
tokio              = { version = "1.35.1", features = ["full"] }
tokio-util         = { version = "0.7", features = ["io"] }
tracing            = { version = "0.1.40" }
tracing-subscriber = { version = "0.3.0", features = ["env-filter"] }

[dev-dependencies]
anyhow = { version = "1.0.63" }
maplit = { version = "1.0.2" }
tempfile = { version = "3.4.0" }


[features]

[package.metadata.docs.rs]
all-features = true
