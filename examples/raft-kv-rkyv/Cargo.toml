[package]
name = "raft-kv-rkyv"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Archive-backed Raft entries using application-managed rkyv buffers"

[dependencies]
anyhow = "1"
bincode = "1.3"
crc32fast = "1"
fs2 = "0.4"
futures = "0.3"
openraft = { path = "../../openraft", default-features = false, features = ["serde", "tokio-rt", "type-alias"] }
rkyv = { version = "=0.8.18", features = ["little_endian", "pointer_width_32"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
