[package]
name = "raft-kv-memstore-weighted-membership"
version = "0.1.0"
readme = "README.md"

edition = "2024"
authors = [
    "drdr xp <drdr.xp@gmail.com>",
]
categories = ["algorithms", "asynchronous", "data-structures"]
description = "The raft-kv-memstore example with a weighted membership, built upon `openraft`."
homepage = "https://github.com/databendlabs/openraft"
keywords = ["raft", "consensus", "membership"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/databendlabs/openraft"

[[bin]]
name = "raft-key-value-weighted"
path = "src/bin/main.rs"

[dependencies]
app-http            = { path = "../app-http" }
log-mem             = { path = "../log-mem" }
network-v2-http     = { path = "../network-v2-http" }
openraft            = { path = "../../openraft", features = ["serde"] }
openraft-membership = { path = "../../membership" }
sm-mem              = { path = "../sm-mem" }
types-kv            = { path = "../types-kv" }

clap               = { version = "4.1.11", features = ["derive", "env"] }
serde              = { version = "1.0.114", features = ["derive"] }
tokio              = { version = "1.35.1", features = ["full"] }
tracing-subscriber = { version = "0.3.0", features = ["env-filter"] }

[dev-dependencies]
anyhow  = { version = "1.0.63" }
reqwest = { version = "0.12.5", features = ["json"] }

[features]

[package.metadata.docs.rs]
all-features = true
