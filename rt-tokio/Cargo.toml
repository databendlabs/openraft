[package]
name = "openraft-rt-tokio"
version = "0.10.0-alpha.38"
edition = "2024"
authors = [
    "drdrxp <drdr.xp@gmail.com>",
    "Databend Authors <opensource@datafuselabs.com>",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/drmingdrmer/openraft"
homepage = "https://github.com/drmingdrmer/openraft"
readme = "README.md"
description = "Tokio runtime implementation for Openraft"

[dependencies]
openraft-rt  = { path = "../rt", version = "0.10.0-alpha.38" }
tokio        = { version = "1.39", default-features = false, features = ["rt", "sync", "time"] }
futures-util = { version = "0.3" }
rand         = { version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"] }

# tokio does not compile for wasm with `rt-multi-thread` enabled.
# On wasm, `TokioRuntime::new()` builds a current-thread runtime instead.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio        = { version = "1.39", default-features = false, features = ["rt-multi-thread"] }

[features]
default = []
single-threaded = ["openraft-rt/single-threaded"]
