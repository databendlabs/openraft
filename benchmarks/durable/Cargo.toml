[package]
name = "bench-durable"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Optional durable-process benchmark harness"

[[bin]]
name = "bench-durable-node"
path = "src/main.rs"

[features]
default = ["runtime-stats"]
rocks = ["dep:raft-kv-rocksdb"]
# Serve each node's stage latencies and `apply()` batch sizes at `/benchmark/runtime_stats`.
runtime-stats = ["openraft/runtime-stats"]

[dependencies]
app-http = { path = "../../examples/app-http" }
network-v2-http = { path = "../../examples/network-v2-http" }
raft-kv-log-wal-sm-mem = { path = "../../examples/raft-kv-log-wal-sm-mem" }
raft-kv-rocksdb = { path = "../../examples/raft-kv-rocksdb", optional = true }
openraft = { path = "../../openraft", features = ["serde", "type-alias"] }
types-kv = { path = "../../examples/types-kv" }
bytes = "1.0"
futures = "0.3"
clap = { version = "4.1", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1.0", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
